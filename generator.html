<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friendsmas draw generator</title><style>body{background:#102d24;color:#f8f0dd;font:16px system-ui;max-width:600px;margin:30px auto;padding:20px}h1{font:italic 40px Georgia;color:#d5bb83}input,button,textarea{font:inherit;padding:12px;border-radius:5px;border:1px solid #a98b50}input{width:100%;box-sizing:border-box}button{background:#d5bb83;color:#102d24;cursor:pointer;margin:8px 0}li{padding:8px 0}small{color:#d5bb83}textarea{width:100%;box-sizing:border-box}</style><h1>Friendsmas draw</h1><p>Des · Mika · Alys · Bree · Anu · Haley · Sarah</p><p>Generate once. Each person receives one unique link; recipients are never shown here. Save the links and send each only to the named friend.</p><label for="url">Published website URL</label><input id="url" type="url" placeholder="https://username.github.io/friendsmas/"><button id="draw">Generate private links</button><p id="status" role="status"></p><ul id="links"></ul><button id="save" hidden>Save all links as a text file</button><script>
const names=['Des','Mika','Alys','Bree','Anu','Haley','Sarah'];let links=[];const $=id=>document.getElementById(id);const enc=b=>btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');function rand(n){const a=new Uint32Array(1),limit=2**32-(2**32%n);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}function shuffle(){let r;do{r=[...names];for(let i=r.length-1;i>0;i--){let j=rand(i+1);[r[i],r[j]]=[r[j],r[i]]}}while(r.some((v,i)=>v===names[i]));return r}function render(){ $('links').replaceChildren();for(const l of links){let li=document.createElement('li');let b=document.createElement('button');b.textContent='Copy '+l.name+'’s link';b.onclick=async()=>{try{await navigator.clipboard.writeText(l.url);$('status').textContent=l.name+'’s link copied.'}catch{let t=document.createElement('textarea');t.value=l.url;li.append(t);t.select();$('status').textContent='Select and copy the link manually.'}};li.append(b);$('links').append(li)}$('draw').disabled=true;$('url').disabled=true;$('save').hidden=false}try{links=JSON.parse(localStorage.getItem('friendsmas2026links')||'[]');if(links.length===7)render()}catch{}$('draw').onclick=async()=>{try{const base=new URL($('url').value);if(base.protocol!=='https:')throw Error('Enter your published HTTPS website URL.');base.hash='';base.search='';$('draw').disabled=true;const r=shuffle();const generated=[];for(let i=0;i<names.length;i++){const key=crypto.getRandomValues(new Uint8Array(32)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await crypto.subtle.importKey('raw',key,'AES-GCM',false,['encrypt']);const cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify({g:names[i],r:r[i]}))));const bytes=new Uint8Array(iv.length+cipher.length);bytes.set(iv);bytes.set(cipher,iv.length);generated.push({name:names[i],url:base.href+'#'+enc(bytes)+'.'+enc(key)})}links=generated;try{localStorage.setItem('friendsmas2026links',JSON.stringify(links))}catch{}render();$('status').textContent='Seven links generated. Save them now; do not draw again.'}catch(e){$('status').textContent=e.message;$('draw').disabled=false}};$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([links.map(l=>l.name+': '+l.url).join('\n\n')],{type:'text/plain'}));a.download='Friendsmas-private-links.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
